# Render.com blueprint — deploy SnapMacro from GitHub.
# After pushing: render.com -> New -> Blueprint -> pick this repo.
# Then set the secret env vars (DATABASE_URL, GEMINI_API_KEY) in the dashboard.
services:
  - type: web
    name: snapmacro
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"     # backend needs >= 3.10 (psycopg 3.2 binary wheels)
      - key: DATABASE_URL
        sync: false          # Supabase connection string — set in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # set in the dashboard, never in the repo
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: USDA_API_KEY
        value: DEMO_KEY
